name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Detect Capacitor setup
        id: capacitor
        shell: bash
        run: |
          if [[ -f "capacitor.config.ts" || -f "capacitor.config.js" || -f "capacitor.config.json" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "android" ]]; then
            echo "android_dir=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_dir=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Android platform exists
        if: steps.capacitor.outputs.enabled == 'true' && steps.capacitor.outputs.android_dir != 'true'
        run: npx cap add android

      - name: Sync Capacitor Android
        if: steps.capacitor.outputs.enabled == 'true'
        run: npx cap sync android

      - name: Validate Android project files
        if: steps.capacitor.outputs.enabled == 'true'
        run: test -f android/gradlew

      - name: Build debug APK
        if: steps.capacitor.outputs.enabled == 'true'
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug | tee ../android-build.log

      - name: Upload debug APK artifact
        if: steps.capacitor.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-racing-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            android-build.log
            android/app/build/reports/**
            android/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if Capacitor configuration is missing
        if: steps.capacitor.outputs.enabled != 'true'
        run: |
          echo "::error::Capacitor configuration file was not found. Expected capacitor.config.ts/js/json for Android APK builds."
          exit 1
